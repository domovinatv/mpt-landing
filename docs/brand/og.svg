<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<!-- Izvor za public/og.png: rsvg-convert -w 1200 -h 630 docs/brand/og.svg -o public/og.png -->
<defs>
  <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#001A3D"/>
    <stop offset="0.55" stop-color="#002A5E"/>
    <stop offset="1" stop-color="#1F3550"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.82" cy="0.05" r="0.45">
    <stop offset="0" stop-color="#3C5A6E" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#3C5A6E" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect width="1200" height="630" fill="url(#glow)"/>

<!-- znak: bijela inačica pločice (na tamnoj pozadini) -->
